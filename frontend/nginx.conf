# 生产前端 nginx 配置（stage 6C spec S）。
#
# - 静态托管 vite build 产物（SPA fallback → index.html）；
# - 同源反代 /api/v1 → 后端容器 8001（浏览器同源请求，避免 CORS）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # V1.1 closure：上传 PDF 可达 100 MiB（后端 source_max_file_size_bytes）；
    # nginx 默认 1m 会直接 413 拦截 multipart 上传。
    client_max_body_size 100m;

    # 后端 API（同源反代；`backend` 为 compose 网络内服务名，容器内端口 8000）。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传 413/超时透传：后端直接响应，不二次缓冲大文件。
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_send_timeout 300s;
        # SSE（task/run 事件流）需关闭代理缓冲，逐事件透传。
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback：非静态资源路径回落到 index.html（前端路由刷新不 404）。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存策略（content-hash 文件名可长缓存）。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

name: insightforge

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-insightforge}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insightforge} -d ${POSTGRES_DB:-insightforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "${CHROMA_HOST_PORT:-8002}:8000"
    volumes:
      - chroma_data:/data
    # 镜像未提供可靠的容器内 curl/wget，不编造内部 healthcheck；
    # backend 的 ready 通过官方客户端 heartbeat 做真实检查。

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      APP_ENV: production
      APP_PORT: "8000"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-insightforge}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-insightforge}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_SSL: "false"
      CHROMA_TIMEOUT_SECONDS: "5"
      RAW_STORAGE_ROOT: /app/data/raw
      EXPORT_STORAGE_ROOT: /app/data/exports
      SOURCE_MAX_FILE_SIZE_BYTES: "104857600"
      # LLM runtime：key 通过宿主 ${DEEPSEEK_API_KEY:-} 运行时注入，**不写入
      # 镜像、不进 build ARG/ENV**；无 key 时为空串（Settings 归一化为 None），
      # 应用仍允许启动，BGE/LLM 都不进入 /ready。
      # DeepSeek 官方已停止 legacy model names（deepseek-chat / deepseek-reasoner）。
      LLM_PROVIDER: deepseek
      LLM_MODEL: deepseek-v4-flash
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "1"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # BGE 模型已固化进镜像（HF_HOME=/home/appuser/.cache/huggingface），
      # 运行时离线加载（V1.1 closure：不依赖 huggingface.co 连通性）。
      HF_HUB_OFFLINE: "1"
    volumes:
      - raw_data:/app/data/raw
      - export_data:/app/data/exports
      # 评估 benchmark workspace（只读诊断：Web 对比视图读取 CLI 产物）。
      - ./benchmark:/app/benchmark:ro
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    # fresh volume 首次启动自动迁移（空库 → head）；迁移幂等，重复启动安全。
    command:
      - sh
      - -c
      - python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 同源：浏览器请求 /api/v1 → nginx 反代到 backend 容器 8000（见
        # frontend/nginx.conf）。容器内无后端时 /api 返回 502（gate 只验前端）。
        VITE_API_BASE_URL: /api/v1
    image: insightforge-frontend:stage6c
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
  raw_data:
  export_data:

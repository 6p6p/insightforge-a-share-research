name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip
        run: python -m pip install --upgrade pip

      - name: Install backend
        # CPU-only torch 契约：torch==2.13.0+cpu 只发布在 PyTorch CPU index
        # （PyPI 的 Linux torch wheel 是 CUDA build）——editable install 必须
        # 带 --extra-index-url；与 backend.Dockerfile（预装 +cpu wheel）和本地
        # 安装（README 同命令）解析到同一 CPU build。
        run: python -m pip install -e "./backend[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Ruff check
        run: ruff check backend

      - name: Ruff format check
        run: ruff format --check backend

      - name: Unit tests
        run: python -m pytest -c backend/pyproject.toml backend/tests -m "not integration" -v

      - name: Dependency consistency
        run: python -m pip check

      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t insightforge-backend:ci .

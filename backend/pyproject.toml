[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightforge-backend"
version = "0.1.0"
description = "InsightForge backend: evidence-driven fundamental research and fact-checking system for A-share listed companies."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "chromadb-client>=1.5.9,<1.6",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    # stage 3C.2.1：DeepSeek 官方 LangChain integration（版本在安装后核实并精确 pin）。
    # 其依赖 langchain-openai / openai / langchain-core 由 pip 解析，不单独 pin。
    "langchain-deepseek==1.1.0",
    "langgraph>=1.2.10,<1.3",
    "langgraph-checkpoint-postgres>=3.1.1,<3.2",
    "lxml==5.4.0",
    "pdfplumber==0.11.10",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pydantic-settings>=2.4,<3.0",
    # stage 6C：确定性导出渲染器（字节确定性 → 精确 pin；renderer 不查 DB、
    # 不调用 LLM / Retrieval / Chroma / Web）。
    "python-docx==1.2.0",
    "python-multipart>=0.0.9,<1.0",
    "reportlab==5.0.0",
    "sentence-transformers==4.1.0",
    "sqlalchemy>=2.0,<2.2",
    "structlog>=24.1,<26.0",
    "tokenizers==0.22.2",
    # CPU-only PyTorch 是冻结运行时契约（BGE/sentence-transformers 不需要
    # CUDA；`torch.version.cuda is None` 由 runtime contract test 强制）。
    # 用 PEP 440 local version `2.13.0+cpu` 精确表达：PyPI 的 Linux torch
    # wheel 是 CUDA build（cuda="13.0"），+cpu wheel 只发布在 PyTorch CPU
    # index（download.pytorch.org/whl/cpu）——所有安装入口（CI / 本地 /
    # Docker）必须带该 index（见 .github/workflows 与 README），保证
    # Docker/CI/local 解析到同一 CPU build。
    "torch==2.13.0+cpu",
    "transformers==4.57.6",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    # ruff 精确 pin：local 与 CI（fresh `pip install -e "./backend[dev]"`）必须
    # 使用同一 formatter 版本（宽泛约束曾导致 CI 装到更新版本而本地滞后）。
    "ruff==0.16.3",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires live PostgreSQL and Chroma services",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# db/models/__init__.py 只负责汇集模型注册进 Base.metadata（autogenerate 依赖），
# 导入本身是副作用；显式豁免 F401。
[tool.ruff.lint.per-file-ignores]
"app/db/models/__init__.py" = ["F401"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insightforge-backend"
version = "0.1.0"
description = "InsightForge backend: evidence-driven fundamental research and fact-checking system for A-share listed companies."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "chromadb-client>=1.5.9,<1.6",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langgraph>=1.2.10,<1.3",
    "langgraph-checkpoint-postgres>=3.1.1,<3.2",
    "lxml>=5.2,<6.0",
    "pdfplumber>=0.11,<0.12",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pydantic-settings>=2.4,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "sqlalchemy>=2.0,<2.2",
    "structlog>=24.1,<26.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.5,<2.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires live PostgreSQL and Chroma services",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
